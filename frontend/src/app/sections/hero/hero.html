<section class="hero-section relative min-h-screen flex items-center overflow-hidden">

  <!-- Grid background -->
  <div class="absolute inset-0 bg-grid-pattern bg-grid opacity-40 pointer-events-none"></div>

  <!-- Radial glow blob -->
  <div class="blob blob-1 pointer-events-none"></div>
  <div class="blob blob-2 pointer-events-none"></div>

  <div class="max-w-7xl mx-auto px-6 w-full grid lg:grid-cols-2 gap-12 items-center pt-20">

    <!-- Left: Text Content -->
    <div>
      <p class="hero-tag inline-flex items-center gap-2 text-primary font-mono text-sm mb-6 opacity-0">
        <span class="w-8 h-px bg-primary"></span>
        Hi, I'm
      </p>

      <h1 class="hero-name font-black leading-none mb-4 opacity-0">
        <span class="block text-5xl sm:text-6xl lg:text-7xl text-white">Kanha</span>
        <span class="block text-5xl sm:text-6xl lg:text-7xl grad-text">Gupta</span>
      </h1>

      <div class="hero-sub flex items-center gap-3 mb-6 opacity-0 h-10">
        <span class="text-xl sm:text-2xl text-muted font-light">{{ displayText() }}</span>
        <span class="w-0.5 h-6 bg-primary animate-blink"></span>
      </div>

      <p class="hero-desc text-muted text-base sm:text-lg max-w-lg leading-relaxed mb-10 opacity-0">
        I build <span class="text-secondary">beautiful</span>, scalable web experiences —
        from pixel-perfect UIs to robust back-ends and everything AI in between.
      </p>

      <div class="hero-btns flex flex-wrap gap-4 opacity-0">
        <button (click)="scrollTo('#projects')" class="btn-primary">
          View My Work
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
          </svg>
        </button>
        <button (click)="scrollTo('#contact')" class="btn-ghost">
          Contact Me
        </button>
      </div>

      <!-- Social Row -->
      <div class="flex items-center gap-6 mt-12">
        <div class="w-8 h-px bg-border"></div>
        <a href="https://github.com/Kanha412" target="_blank" class="social-icon" title="GitHub">
          <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">

          </svg>
        </a>
        <a href="https://linkedin.com/in/kanhagupta412" target="_blank" class="social-icon" title="LinkedIn">
          <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>

        </a>
        <a href="https://leetcode.com/kanhagupta412" target="_blank" class="social-icon" title="LeetCode">
          <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
            <path d="M13.483 0a1.374 1.374 0 0 0-.961.438L7.116 6.226l-3.854 4.126a5.266 5.266 0 0 0-1.209 2.104 5.35 5.35 0 0 0-.125.513 5.527 5.527 0 0 0 .062 2.362 5.83 5.83 0 0 0 .349 1.017 5.938 5.938 0 0 0 1.271 1.818l4.277 4.193.039.038c2.248 2.165 5.852 2.133 8.063-.074l2.396-2.392c.54-.54.54-1.414.003-1.955a1.378 1.378 0 0 0-1.951-.003l-2.396 2.392a3.021 3.021 0 0 1-4.205.038l-.02-.019-4.276-4.193c-.652-.64-.972-1.469-.948-2.263a2.68 2.68 0 0 1 .066-.523 2.545 2.545 0 0 1 .619-1.164L9.13 8.114c1.058-1.134 3.204-1.27 4.43-.278l3.501 2.831c.593.48 1.461.387 1.94-.207a1.384 1.384 0 0 0-.207-1.943l-3.5-2.831c-.8-.647-1.766-1.045-2.774-1.202l2.015-2.158A1.384 1.384 0 0 0 13.483 0zm-2.866 12.815a1.38 1.38 0 0 0-1.38 1.382 1.38 1.38 0 0 0 1.38 1.382H20.79a1.38 1.38 0 0 0 1.38-1.382 1.38 1.38 0 0 0-1.38-1.382z"/>
          </svg>
        </a>
        <div class="w-8 h-px bg-border"></div>
      </div>
    </div>

    <!-- Right: Three.js Canvas -->
    <div class="hero-canvas relative flex items-center justify-center opacity-0">
      <canvas #canvas class="three-canvas"></canvas>
      <!-- Orbital rings decoration -->
      <div class="orbital ring-1"></div>
      <div class="orbital ring-2"></div>
    </div>

  </div>

  <!-- Scroll hint -->
  <div class="scroll-hint">
    <div class="scroll-line"></div>
    <span class="font-mono text-xs text-muted">scroll</span>
  </div>

</section>
