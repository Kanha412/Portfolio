<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Kanha Gupta Portfolio</title>
  <script>
    // SPA redirect trick for GitHub Pages
    // Encodes the full URL path into a query string, then index.html redirects back
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1).join('/') +
      '/?p=/' + l.pathname.slice(1).replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>Redirecting...</body>
</html>
